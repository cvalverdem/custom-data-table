<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>Tabla personalizada</title>
  </head>
  <body>
    <div id="app" class="azdo-card">
      <div class="azdo-card-header">
        <div class="azdo-toolbar">
          <button id="addRowBtn" type="button" class="azdo-btn">
            <span class="bowtie-icon bowtie-math-plus"></span>
            <span>Agregar fila</span>
          </button>
          <span id="validationMessage" class="azdo-validation-message" aria-live="polite"></span>
          <span id="status" class="azdo-status"></span>
        </div>
      </div>
      <div class="azdo-table-wrap">
        <table id="gridTable" class="azdo-table">
          <thead><tr id="gridHeaderRow"></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </body>
</html>
